<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>

        <!--tag form serve para iniciar um formulário
            Action - recebe um url de destino dos dados
            Method - Qual é a forma de envio do formulário
                - GET  -> Pega os dados do formulário e insere na URL
                - POST -> Pega os dados do formulário e envia para o back-end
        -->      

        <form action="" method="get">

            <!--A tag fieldset é para representar um conjunto de um determinado assunto do formulário-->
            <fieldset>     
                
                <!-- A tag legend esta diretamente relacionada ao fieldset, pois ela irá dar o nome do conjunto de informações -->
                <legend>Dados Pessoais</legend>
                
                <!-- Tag label é especifica para descrever os campos
                    Atributo for - Neste atributo passamos o nome do campo que queremos descrever
                -->

                <label for="userName">Nome</label>

                <!-- tag input é um campo que é inserido normalmente dentro de um formulário, ele possui diversos tipos: text, number, password e etc -->

                <input type="text" name="userName" required>

                <label for="userAge">Idade</label>
                <input type="number" min="12" max="100" name="age" required>

                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate">

                <label for="userEmail">E-mail</label>
                <input type="email" name="userEmail">

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="51998645789">

                <label for="userImage">Upload de foto</label>
                <input type="file" accept="image/*" name="userImage">
                <!-- tag button é um botão genérico que para um formulário e essencial para o envio das informações-->
            </fieldset>
            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero</p>
                <input type="radio" name="userGender">
                <label for="userGender" value="Feminino">Feminino</label>

                <input type="radio" name="userGender">
                <label for="userGender" value="Masculino">Masculino</label>

                <input type="radio" name="userGender">
                <label for="userGender" value="notInformed">Prefiro não informar</label>
                <div>
                    <label for="maritalStatus">Estado Civil</label>
                    <select name="maritalStatus">
                        <option value="notInformed">Escolha...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="uniao-estavel">União Estavel</option>
                    </select>
                </div>

                <div>
                    <label for="userState">Estado:</label>
                    <select name="userState">
                        <option value="Acre">Acre</option>
                        <option value="Alagoas">Alagoas</option>
                        <option value="Amapá">Amapá</option>
                        <option value="Amazonas">Amazonas</option>
                        <option value="Bahia">Bahia</option>
                        <option value="Ceará">Ceará</option>
                        <option value="Distrito">Distrito Federal</option> 
                        <option value="Espirito">Espirito Santo</option> 
                        <option value="Goiás">Goiás</option>
                        <option value="Maranhão">Maranhão</option>
                        <option value="Mato">Mato Grosso do Sul</option> 
                        <option value="Mato">Mato Grosso</option> 
                        <option value="Minas">Minas Gerais</option> 
                        <option value="Pará">Pará</option>
                        <option value="Paraíba">Paraíba</option>
                        <option value="Paraná">Paraná</option>
                        <option value="Pernambuco">Pernambuco</option>
                        <option value="Piauí">Piauí</option>
                        <option value="Rio">Rio de Janeiro</option> 
                        <option value="Rio">Rio Grande do Norte</option> 
                        <option value="Rio">Rio Grande do Sul</option> 
                        <option value="Rondônia">Rondônia</option>
                        <option value="Roraima">Roraima</option>
                        <option value="Santa">Santa Catarina</option> 
                        <option value="São">São Paulo</option> 
                        <option value="Sergipe">Sergipe</option>
                        <option value="Tocantins">Tocantins</option>
                    </select>
                </div>
                <label for="city">Cidade:</label>
                <input type="text" name="city">
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
