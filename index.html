<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="http  s://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
            <img src="./img/logo-culturama.png" alt="Logo culturama">
            <h1>Pesquisa Online</h1>
        </header>
        <section>

            <!--tag form serve para iniciar um formulário
                Action - recebe um url de destino dos dados
                Method - Qual é a forma de envio do formulário
                    - GET  -> Pega os dados do formulário e insere na URL
                    - POST -> Pega os dados do formulário e envia para o back-end
            -->      

            <form action="" method="get">

                <!--A tag fieldset é para representar um conjunto de um determinado assunto do formulário-->
                <fieldset>     
                    
                    <!-- A tag legend esta diretamente relacionada ao fieldset, pois ela irá dar o nome do conjunto de informações -->
                    <legend>Dados Pessoais</legend>
                    
                    <!-- Tag label é especifica para descrever os campos
                        Atributo for - Neste atributo passamos o nome do campo que queremos descrever
                    -->

                    <label for="name">Nome</label>

                    <!-- tag input é um campo que é inserido normalmente dentro de um formulário, ele possui diversos tipos: text, number, password e etc -->

                    <input type="text" name="userName" id="name" required>

                    <label for="age">Idade</label>
                    <input type="number" min="12" max="100" name="age" id="age" required>

                    <label for="birthDay">Data de nascimento</label>
                    <input type="date" name="birthDate" id="birthDay">

                    <label for="email">E-mail</label>
                    <input type="email" name="userEmail" id="email">

                    <label for="phone">Telefone</label>
                    <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="51998645789" id="phone">

                    <label for="image">Upload de foto</label>
                    <input type="file" accept="image/*" name="userImage" id="image">
                    <!-- tag button é um botão genérico que para um formulário e essencial para o envio das informações-->
                </fieldset>
                <fieldset>
                    <legend>Perfil</legend>

                    <p>Gênero</p>
                    <input type="radio" name="userGender" id="fem">
                    <label for="fem" value="Feminino">Feminino</label>

                    <input type="radio" name="userGender" id="masc">
                    <label for="masc" value="Masculino">Masculino</label>

                    <input type="radio" name="userGender" id="notInformed">
                    <label for="notInformed" value="notInformed">Prefiro não informar</label>
                    <div>
                        <label for="maritalStatus">Estado Civil</label>
                        <select name="maritalStatus" id="maritalStatus">
                            <option value="notInformed">Escolha...</option>
                            <option value="casado">Casado</option>
                            <option value="solteiro">Solteiro</option>
                            <option value="divorciado">Divorciado</option>
                            <option value="uniao-estavel">União Estavel</option>
                        </select>
                    </div>

                    <div>
                        <label for="state">Estado:</label>
                        <select name="userState" id="state">
                            <option value="acre">Acre</option>
                            <option value="alagoas">Alagoas</option>
                            <option value="amapa">Amapá</option>
                            <option value="amazonas">Amazonas</option>
                            <option value="bahia">Bahia</option>
                            <option value="ceara">Ceará</option>
                            <option value="distritoFederal">Distrito Federal</option> 
                            <option value="espiritoSanto">Espirito Santo</option> 
                            <option value="goiás">Goiás</option>
                            <option value="maranhão">Maranhão</option>
                            <option value="matoGrossoDoSul">Mato Grosso do Sul</option> 
                            <option value="matoGrosso">Mato Grosso</option> 
                            <option value="minasGerais">Minas Gerais</option> 
                            <option value="para">Pará</option>
                            <option value="paraiba">Paraíba</option>
                            <option value="parana">Paraná</option>
                            <option value="pernambuco">Pernambuco</option>
                            <option value="piaui">Piauí</option>
                            <option value="rioDeJaneiro">Rio de Janeiro</option> 
                            <option value="rioGrandeDoNorte">Rio Grande do Norte</option> 
                            <option value="rioGrandeDoSul">Rio Grande do Sul</option> 
                            <option value="rondonia">Rondônia</option>
                            <option value="roraima">Roraima</option>
                            <option value="santaCatarina">Santa Catarina</option> 
                            <option value="saoPaulo">São Paulo</option> 
                            <option value="sergipe">Sergipe</option>
                            <option value="tocantins">Tocantins</option>
                        </select>
                    </div>
                    <label for="city">Cidade:</label>
                    <input type="text" name="city" id="city">
                </fieldset> 
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Rede Social</p>
                    <input type="checkbox" name="social" id="instagram" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input type="checkbox" name="social" id="facebook" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input type="checkbox" name="social" id="linkedin" value="linkedin">
                    <label for="linkedin">Linkedin</label>
                    <br>
                    <input type="checkbox" name="social" id="x" value="X">
                    <label for="x">X</label>
                    <br>
                    <label for="musicStyle">Estilo Musical</label>
                    <input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">
                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Sertanejo">
                        <option value="Rock">
                        <option value="Samba">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor Favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                </fieldset>     
                <fieldset>
                    <legend>Satisfação</legend>
                    <p>Dê sua opinião:</p>
                    <input id="great" type="radio" name="userSatisfaction" checked value="otimo">
                    <label for="great">Ótimo</label><br>

                    <input id="good" type="radio" name="userSatisfaction" value="bom">
                    <label for="good">Bom</label><br>

                    <input id="Regular" type="radio" name="userSatisfaction" value="regular">
                    <label for="Regular">Regular</label><br>

                    <input id="bad" type="radio" name="userSatisfaction" value="ruim">
                    <label for="bad">Ruim</label><br>

                    <br>   

                    <label for="comment">Deixe o seu comentário:</label>
                    <textarea name="userComment" id="comment" placeholder="Digite seu texto aqui..."></textarea>
                </fieldset>       
                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>
                    
                    <input type="checkbox" name="userGetResult" id="getResult" value="accepted">
                    <label for="userLgpdTerm">Desejo receber o resultado por e-mail</label><br>
                </fieldset>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>
</body>
</html>
